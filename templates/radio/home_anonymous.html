{% extends "base.html" %}

{% block title %}{{ SITE_TITLE }}{% endblock %}

{% block content %}
<div class="container" style="max-width:480px;padding-top:var(--space-24);text-align:center;">
    <h1>{{ SITE_TITLE }}</h1>
    <p class="text-lg" style="margin-bottom:var(--space-12);">
        Listen to live radio transmissions from local emergency services.
    </p>

    <div>
        <a href="{% url 'login' %}" class="btn btn-primary btn-lg w-full" style="margin-bottom:var(--space-4);">
            Sign In
        </a>

        {% if OPEN_REGISTRATION %}
        <p class="text-sm text-muted">
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </p>
        {% endif %}
    </div>
</div>
{% endblock %}
